name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually click "Run workflow" on GitHub anytime

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Clone your project code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17 (Required by Android Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter Engine
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Fetch Packages (Firebase, Audio, FilePicker, etc.)
      - name: Install Dependencies
        run: flutter pub get

      # 5. Compile the Android Release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 6. Upload the finished APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dim-institution-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14